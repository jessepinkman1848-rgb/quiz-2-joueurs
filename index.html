<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notre petit jeu — V3.3</title>

<style>
:root{
  --ink:#26342d;
  --muted:#66736b;
  --paper:#fbf7ee;
  --card:#fffdf8;
  --sage:#718878;
  --sage-dark:#4d6555;
  --terracotta:#b87358;
  --line:#ded9cc;
  --shadow:0 14px 40px rgba(49,58,49,.10)
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%,rgba(113,136,120,.14),transparent 28%),
    radial-gradient(circle at 90% 85%,rgba(184,115,88,.10),transparent 25%),
    var(--paper)
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:radial-gradient(rgba(38,52,45,.18) .45px,transparent .45px);
  background-size:7px 7px
}

#app{
  position:relative;
  max-width:920px;
  margin:0 auto;
  padding:34px 20px 60px
}

.brand{
  text-align:center;
  margin:10px 0 30px
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.22em;
  font-size:11px;
  color:var(--sage-dark);
  font-weight:700
}

.brand h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(36px,7vw,58px);
  font-weight:400;
  line-height:1;
  margin:10px 0 8px
}

.brand .motto{
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  color:var(--muted);
  font-size:18px
}

.sprig{
  color:var(--sage);
  font-size:24px;
  letter-spacing:8px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px
}

.card{
  background:rgba(255,253,248,.94);
  border:1px solid rgba(222,217,204,.9);
  border-radius:20px;
  padding:25px;
  box-shadow:var(--shadow);
  margin:16px 0
}

.card.wide{
  grid-column:1/-1
}

.card h2{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:27px;
  margin:0 0 8px
}

.card p{
  color:var(--muted);
  line-height:1.55
}

.icon{
  font-size:25px;
  margin-bottom:12px
}

.note{
  font-size:14px
}

button{
  appearance:none;
  border:0;
  border-radius:12px;
  padding:12px 17px;
  background:var(--sage-dark);
  color:white;
  font:600 14px inherit;
  cursor:pointer;
  margin:4px 4px 4px 0;
  transition:transform .12s,opacity .12s,background .12s
}

button:hover{
  transform:translateY(-1px);
  opacity:.94
}

button.secondary{
  background:transparent;
  color:var(--sage-dark);
  border:1px solid #bfc8bf
}

button.accent{
  background:var(--terracotta)
}

button.answer{
  display:block;
  width:100%;
  text-align:left;
  background:#f5f1e7;
  color:var(--ink);
  border:1px solid var(--line);
  padding:16px 18px;
  font-weight:500;
  margin:9px 0
}

button.answer:hover{
  background:#ebe5d8;
  border-color:#b8c1b8
}

input,textarea,select{
  width:100%;
  box-sizing:border-box;
  padding:12px 13px;
  margin:6px 0 13px;
  border:1px solid #d2cec2;
  border-radius:10px;
  background:#fffefa;
  color:var(--ink);
  font:inherit
}

input:focus,textarea:focus,select:focus{
  outline:2px solid rgba(113,136,120,.28);
  border-color:var(--sage)
}

.q{
  border:1px solid var(--line);
  background:#fffdf9;
  padding:17px;
  border-radius:15px;
  margin:12px 0
}

.q b{
  display:block;
  color:var(--sage-dark);
  font-family:Georgia,serif;
  font-size:17px;
  margin-bottom:6px
}

.code{
  font-family:Georgia,serif;
  font-size:38px;
  font-weight:700;
  letter-spacing:8px;
  text-align:center;
  padding:18px;
  color:var(--sage-dark)
}

.success{
  padding:14px 16px;
  background:#edf3ed;
  border:1px solid #d3dfd4;
  border-radius:11px;
  margin:14px 0;
  color:#405344
}

.status{
  text-align:center;
  font-weight:600;
  margin:12px;
  color:var(--terracotta)
}

.progress{
  height:7px;
  background:#e8e3d8;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0 24px
}

.progress span{
  display:block;
  height:100%;
  background:var(--sage);
  transition:width .2s
}

.turn{
  display:inline-block;
  padding:7px 11px;
  border-radius:999px;
  background:#edf2ed;
  color:var(--sage-dark);
  font-size:13px;
  font-weight:700
}

.question{
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;
  line-height:1.25;
  font-weight:400;
  margin:16px 0 25px
}

.scorebar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:var(--muted);
  font-size:14px
}

.scorebar b{
  color:var(--ink)
}

.result-score{
  font-family:Georgia,serif;
  font-size:22px;
  margin:14px 0
}

.footer{
  text-align:center;
  color:#8a8f89;
  font-size:12px;
  margin-top:30px
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr
  }

  .card.wide{
    grid-column:auto
  }

  #app{
    padding:22px 14px 40px
  }

  .card{
    padding:20px
  }

  .question{
    font-size:25px
  }
}
</style>
</head>

const app = document.getElementById("app");

/* =========================
   INTERFACE
========================= */

function shell(content){

  app.innerHTML = `

  <div class="brand">

      ✦ ❧ ✦

/* =========================
   SUPABASE
========================= */

async function supabaseRpc(functionName,body){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/${functionName}`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":
            `Bearer ${SUPABASE_KEY}`
        },
        body:JSON.stringify(body)
      }
    );

  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      text ||
      `Erreur Supabase ${response.status}`
    );
  }

  return response.json();
}


/* =========================
   ACCUEIL
========================= */

/* =========================
   CREATION
========================= */

function createForm(){

  shell(`

  <div class="card wide">

    <div class="eyebrow">
      votre carnet de questions
    </div>

    <h2>
      Préparez vos 30 questions
    </h2>

    <p class="note">
      Des souvenirs, des détails,

    </p>

    <input
      id="name"
      placeholder="Votre prénom ou surnom"
    >

    <div id="qs"></div>

    <button onclick="saveQuestions()">
      Enregistrer et obtenir mon code
    </button>

      class="secondary"
      onclick="home()">

      Retour

    </button>

  </div>

  `);

  buildQuestionFields();
}


/* =========================
   QUESTIONS
========================= */

function buildQuestionFields(existing=null){

  const q =
    document.getElementById("qs");

  q.innerHTML = "";

  for(let i=1;i<=30;i++){

    const item =
      existing ?
      existing[i-1] :
      null;

    q.innerHTML += `

    <div class="q">

      <b>
        Question ${i}
      </b>

      <textarea
        id="q${i}"
        rows="2"
        placeholder="Votre question"
      >${item ? escapeHTML(item.q) : ""}</textarea>

      <input
        id="a${i}1"
        placeholder="Réponse A"
        value="${item ? escapeAttribute(item.a[0]) : ""}"
      >

      <input
        id="a${i}2"
        placeholder="Réponse B"
        value="${item ? escapeAttribute(item.a[1]) : ""}"
      >

      <input
        id="a${i}3"
        placeholder="Réponse C"
        value="${item ? escapeAttribute(item.a[2]) : ""}"
      >

      <select id="ok${i}">

        <option value="">
          Bonne réponse…
        </option>

        <option
          value="0"
          ${item && item.ok===0 ? "selected" : ""}>
          A
        </option>

        <option
          value="1"
          ${item && item.ok===1 ? "selected" : ""}>
          B
        </option>

        <option
          value="2"
          ${item && item.ok===2 ? "selected" : ""}>
          C
        </option>

      </select>

    </div>

    `;
  }
}


/* =========================
   COLLECTE
========================= */

function collectQuestions(){

  let questions = [];

  for(let i=1;i<=30;i++){

    const text =
      document
        .getElementById("q"+i)
        .value
        .trim();

    const answers = [

      document
        .getElementById("a"+i+"1")
        .value
        .trim(),

      document
        .getElementById("a"+i+"2")
        .value
        .trim(),

      document
        .getElementById("a"+i+"3")
        .value
        .trim()

    ];

    const correct =
      document
        .getElementById("ok"+i)
        .value;

    if(
      !text ||
      answers.some(x=>!x) ||
      correct === ""
    ){

      alert(
        `Merci de compléter la question ${i}.`
      );

      return null;
    }

    questions.push({
      q:text,
      a:answers,
      ok:Number(correct)
    });

  }

  return questions;
}


/* =========================
   SAUVEGARDE
========================= */

async function saveQuestions(){

  const name =
    document
      .getElementById("name")
      .value
      .trim() ||
      "Joueur";

  const questions =
    collectQuestions();

  if(!questions)
    return;

  const code =
    String(
      Math.floor(
        100000 +
        Math.random()*900000
      )
    );

  try{

    const result =
      await supabaseRpc(
        "save_quiz",
        {
          p_code:code,
          p_player_name:name,
          p_questions:questions
        }
      );

    if(result === false){

      alert(
        "Ce code existe déjà. " +
        "Veuillez réessayer."
      );

      return;
    }

    showSavedCode(name,code);

  }

  catch(error){

    console.error(error);

    alert(
      "Impossible d'enregistrer " +
      "le questionnaire.\n\n" +
      error.message
    );
  }
}


/* =========================
   CODE
========================= */

    </div>

    <button

  `);
}


/* =========================
   LECTURE
========================= */

async function getQuiz(code){

  const result =
    await supabaseRpc(
      "get_quiz",
      {
        p_code:code
      }
    );

  if(
    !Array.isArray(result) ||
    result.length === 0
  ){

    return null;
  }

  return {

    name:
      result[0].player_name,

    qs:
      result[0].questions

  };
}


/* =========================
   MODIFICATION
========================= */

async function loadQuestionnaireForEdit(
  codeFromButton=null
){

  const code =
    codeFromButton ||
    (
      document.getElementById("editCode") ?
      document.getElementById("editCode").value.trim() :
      ""
    );

  if(!/^\d{6}$/.test(code)){

    alert(
      "Veuillez saisir un code à 6 chiffres."
    );

    return;
  }

  try{

    const quiz =
      await getQuiz(code);

    if(!quiz){

      alert(
        "Aucun questionnaire trouvé " +
        "avec ce code."
      );

      return;
    }

    if(
      !Array.isArray(quiz.qs) ||
      quiz.qs.length !== 30
    ){

      alert(
        "Ce questionnaire ne contient " +
        "pas exactement 30 questions."
      );

      return;
    }

    shell(`

    <div class="card wide">

      <div class="eyebrow">
        édition privée
      </div>

      <h2>
        Modifier mon questionnaire
      </h2>

      <p>
        Joueur :
        <b>${escapeHTML(quiz.name)}</b>
        · Code :
        <b>${code}</b>
      </p>

      <div class="success">

        Modifiez ce que vous souhaitez.
        Votre code
        <b>${code}</b>
        restera inchangé.

      </div>

      <input
        id="name"
        value="${escapeAttribute(quiz.name)}"
        placeholder="Nom du joueur"
      >

      <div id="qs"></div>

      <button
        onclick="updateQuestions('${code}')">

        Enregistrer les modifications

      </button>

      <button
        class="secondary"
        onclick="home()">

        Annuler

      </button>

    </div>

    `);

    buildQuestionFields(quiz.qs);

  }

  catch(error){

    console.error(error);

    alert(
      "Impossible de récupérer " +
      "le questionnaire.\n\n" +
      error.message
    );
  }
}


/* =========================
   MISE A JOUR
========================= */

async function updateQuestions(code){

  const name =
    document
      .getElementById("name")
      .value
      .trim() ||
      "Joueur";

  const questions =
    collectQuestions();

  if(!questions)
    return;

  try{

    const result =
      await supabaseRpc(
        "update_quiz",
        {
          p_code:code,
          p_player_name:name,
          p_questions:questions
        }
      );

    if(result !== true){

      alert(
        "Impossible de modifier " +
        "ce questionnaire."
      );

      return;
    }

    shell(`

    <div
      class="card"
      style="text-align:center">

      <div class="icon">
        ✦
      </div>

      <h2>
        Modifications enregistrées
      </h2>

      <p>
        Tout est prêt,
        et votre code reste :
      </p>

      <div class="code">
        ${code}
      </div>

      <button
        onclick="loadQuestionnaireForEdit('${code}')">

        Modifier encore

      </button>

      <button
        class="secondary"
        onclick="home()">

        Retour à l'accueil

      </button>

    </div>

    `);

  }

  catch(error){

    console.error(error);

    alert(
      "Impossible d'enregistrer " +
      "les modifications.\n\n" +
      error.message
    );
  }
}


/* =========================
   COPIE
========================= */

function copyCode(code){

  if(navigator.clipboard){

    navigator.clipboard
      .writeText(code)
      .then(
        () =>
          alert(
            "Code copié : " + code
          )
      )
      .catch(
        () =>
          alert(
            "Votre code est : " + code
          )
      );

  }else{

    alert(
      "Votre code est : " + code
    );
  }
}


/* =========================
   PARTIE
========================= */

async function startGame(){

  const code1 =
    document
      .getElementById("c1")
      .value
      .trim();

  const code2 =
    document
      .getElementById("c2")
      .value
      .trim();

  const status =
    document
      .getElementById("status");

  if(
    !/^\d{6}$/.test(code1) ||
    !/^\d{6}$/.test(code2)
  ){

    status.textContent =
      "Veuillez saisir deux codes à 6 chiffres.";

    return;
  }

  status.textContent =
    "Les deux carnets arrivent…";

  try{

    const [
      player1,
      player2
    ] =
      await Promise.all([

        getQuiz(code1),
        getQuiz(code2)

      ]);

    if(!player1){

      status.textContent =
        "Le code du joueur 1 est introuvable.";

      return;
    }

    if(!player2){

      status.textContent =
        "Le code du joueur 2 est introuvable.";

      return;
    }

    if(
      !Array.isArray(player1.qs) ||
      player1.qs.length !== 30 ||
      !Array.isArray(player2.qs) ||
      player2.qs.length !== 30
    ){

      status.textContent =
        "Un des questionnaires n'a pas 30 questions.";

      return;
    }

    state.game = {

      players:[
        player1,
        player2
      ],

      turn:0,

      index:0,

      score:[
        0,
        0
      ]

    };

    showQuestion();

  }

  catch(error){

    console.error(error);

    status.textContent =
      "Erreur de connexion.";

    alert(
      "Impossible de récupérer " +
      "les questionnaires.\n\n" +
      error.message
    );
  }
}


/* =========================
   QUESTION
========================= */

function showQuestion(){

  const game =
    state.game;

  const player =
    game.players[
      game.turn
    ];

  const question =
    player.qs[
      game.index
    ];

  const totalAnswered =
    game.index * 2 +
    game.turn;

  const progress =
    Math.round(
      totalAnswered / 60 * 100
    );

  shell(`

  <div class="card">

    <div class="scorebar">

      <span>
        Question
        ${game.index+1}
        / 30
      </span>

      <span>

        <b>
          ${escapeHTML(
            game.players[0].name
          )}
        </b>

        ${game.score[0]}

        ·

        ${game.score[1]}

        <b>
          ${escapeHTML(
            game.players[1].name
          )}
        </b>

      </span>

    </div>

    <div class="progress">
      <span
        style="width:${progress}%">
      </span>
    </div>

    <span class="turn">

      Au tour de
      ${escapeHTML(player.name)}

    </span>

    <div class="question">

      ${escapeHTML(question.q)}

    </div>

    ${
      question.a.map(
        (answer,i)=>`

        <button
          class="answer"
          onclick="answerQuestion(${i})">

          <b>
            ${String.fromCharCode(65+i)}.
          </b>

          ${escapeHTML(answer)}

        </button>

        `
      ).join("")
    }

  </div>

  `);
}


/* =========================
   REPONSE
========================= */

function answerQuestion(answer){

  const game =
    state.game;

  const player =
    game.players[
      game.turn
    ];

  const question =
    player.qs[
      game.index
    ];

  if(
    answer === question.ok
  ){

    game.score[
      game.turn
    ]++;

  }

  game.turn =
    1 - game.turn;

  if(game.turn === 0){

    game.index++;

  }

  if(game.index >= 30){

    showResults();

    return;
  }

  showQuestion();
}


/* =========================
   RESULTATS
========================= */

function showResults(){

  const game =
    state.game;

  const score1 =
    game.score[0];

  const score2 =
    game.score[1];

  const percent1 =
    Math.round(
      score1 / 30 * 100
    );

  const percent2 =
    Math.round(
      score2 / 30 * 100
    );

  let result;

  if(score1 > score2){

    result = `
      <h2>
        ${escapeHTML(
          game.players[0].name
        )}
        remporte la partie !
      </h2>
    `;

  }else if(score2 > score1){

    result = `
      <h2>
        ${escapeHTML(
          game.players[1].name
        )}
        remporte la partie !
      </h2>
    `;

  }else{

    result = `
      <h2>
        Égalité !
      </h2>
    `;
  }

  shell(`

  <div
    class="card"
    style="text-align:center">

    <div class="sprig">
      ✦ ❧ ✦
    </div>

    <h2>
      La nuitée touche à sa fin
    </h2>

    <p class="result-score">

      <b>
        ${escapeHTML(
          game.players[0].name
        )}
      </b>

      · ${score1}/30
      · ${percent1} %

    </p>

    <p class="result-score">

      <b>
        ${escapeHTML(
          game.players[1].name
        )}
      </b>

      · ${score2}/30
      · ${percent2} %

    </p>

    ${result}

    <button onclick="home()">
      Une autre partie
    </button>

  </div>

  `);
}

========================= */

function escapeHTML(text){

  return String(text).replace(
    /[&<>"']/g,

    char =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char])
  );
}


function escapeAttribute(text){

  return escapeHTML(text)
    .replace(/\n/g," ");
}
